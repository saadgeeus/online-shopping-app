version: 0.2

env:
  parameter-store:
    DOCKER_REGISTRY_USERNAME: /myapp/docker-credentials/username
    DOCKER_REGISTRY_PASSWORD: /myapp/docker-credentials/password
    DOCKER_REGISTRY_URL: /myapp/docker-registry/url

phases:
  install:
    runtime-versions:
      nodejs: 18 # Node 12 bohot purana hai, modern apps ke liye 18+ behtar hai
    commands:
      - echo Installing dependencies...
      - npm install

  pre_build:
    commands:
      - echo Logging in to Docker Registry...
      - echo "$DOCKER_REGISTRY_PASSWORD" | docker login -u "$DOCKER_REGISTRY_USERNAME" --password-stdin
      - IMAGE_REPO_NAME="app-online-shop"
      - IMAGE_NAME="$DOCKER_REGISTRY_USERNAME/$IMAGE_REPO_NAME"
      
      # Versioning Logic: Build ID ka chota hissa aur timestamp use karein
      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - BUILD_TAG=${COMMIT_HASH:=build-$(date +%Y%m%d%H%M%S)}
      - echo "Setting Image Tag to $BUILD_TAG"

  build:
    commands:
      - echo Build started on `date`
      - echo Building the Docker image with tags...
      # Do tags banayein: ek unique version aur ek 'latest'
      - docker build -t $IMAGE_NAME:$BUILD_TAG .
      - docker tag $IMAGE_NAME:$BUILD_TAG $IMAGE_NAME:latest

  post_build:
    commands:
      - echo Build completed on `date`
      - echo Pushing the Docker images to Docker Hub...
      # Dono tags push karein
      - docker push $IMAGE_NAME:$BUILD_TAG
      - docker push $IMAGE_NAME:latest
      
      - echo Packaging application for S3...
      - zip -r online-shop-app.zip * .[^.]* -x "node_modules/*" ".git/*"
      - aws s3 cp online-shop-app.zip s3://aws-s3-bucket-ci-cd/online-shop-app/
      
      - echo Writing image definitions file...
      # Sahi Version tag ke sath definitions file banayein
      - printf '[{"name":"online-shop-container","imageUri":"%s"}]' $IMAGE_NAME:$BUILD_TAG > imagedefinitions.json
      - cat imagedefinitions.json

artifacts:
  files:
    - '**/*'
    - imagedefinitions.json
  exclude-patterns:
    - 'node_modules/**/*'
    - '.git/**/*'
